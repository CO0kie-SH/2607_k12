<!doctype html>
<html lang="zh-CN">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <title>K12 工作台入口</title>
  <link rel="stylesheet" href="/static/style.css" />
</head>
<body>
  <main class="page home-page">
    <section class="topbar">
      <div>
        <h1>K12 工作台</h1>
        <p>先登录后使用 WebSocket 后端查询版本。</p>
      </div>
      <div id="auth-status" class="status disconnected">未登录</div>
    </section>

    <section class="login-panel">
      <div class="login-fields">
        <label>
          <span>账号名</span>
          <input id="login-username" class="text-input" autocomplete="username" placeholder="admin" />
        </label>
        <label>
          <span>密码</span>
          <input id="login-password" class="text-input" type="password" autocomplete="current-password" placeholder="请输入密码" />
        </label>
      </div>
      <div class="login-buttons">
        <button id="query-account-btn" type="button">查询</button>
        <button id="login-btn" type="button">登录</button>
      </div>
      <div id="auth-result" class="result-line">等待输入账号</div>
      <textarea id="risk-output" class="risk-output" spellcheck="false" readonly placeholder="查询后显示 remote、RPM 和可用次数"></textarea>
    </section>

    <section class="home-actions">
      <a class="home-button" href="/html/websocket">
        <span>WebSocket 版本</span>
        <small>连接后端，查询账号接口并导出 JSON</small>
      </a>
      <a class="home-button secondary" href="/html/js">
        <span>纯 JS 版本</span>
        <small>仅在浏览器本地解析 AT，不连接后端</small>
      </a>
    </section>
  </main>
  <script src="/static/index.js?v=260704-local-whitelist"></script>
</body>
</html>
