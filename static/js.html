<!doctype html>
<html lang="zh-CN">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <title>K12 空间申请 - 纯 JS</title>
  <link rel="stylesheet" href="/static/style.css" />
</head>
<body>
  <main class="page">
    <section class="topbar">
      <div>
        <h1>K12 空间申请</h1>
        <p>纯 JS 本地解析 · 不联网 · 不经过本项目后端</p>
      </div>
      <div id="status" class="status connected">纯前端模式</div>
    </section>

    <section class="workspace">
      <article class="panel">
        <div class="panel-title">
          <h2>AT 信息</h2>
          <button id="inspect-btn">提交查询</button>
        </div>
        <textarea id="access-token" class="token-box" spellcheck="false" placeholder="eyJ..."></textarea>
        <div id="result-line" class="result-line">等待输入</div>
        <div class="progress-title">查询过程</div>
        <div id="progress-log" class="progress-log">等待提交</div>
      </article>

      <article class="panel">
        <div class="panel-title">
          <h2>账号信息</h2>
          <button id="reload-btn" class="inactive-btn" disabled>申请空间</button>
        </div>
        <textarea id="account-info" class="info-box" spellcheck="false" readonly></textarea>
        <div class="field-title">空间ID</div>
        <textarea id="workspace-id" class="workspace-id-box" spellcheck="false" placeholder="workspace_id"></textarea>
      </article>

      <article class="panel">
        <div class="panel-title">
          <h2>操作日志</h2>
          <button id="save-log-btn" class="inactive-btn" disabled>保存日志</button>
        </div>
        <textarea id="operator-log" class="log-input" spellcheck="false" placeholder="纯前端模式下日志只显示在当前页面"></textarea>
      </article>
    </section>
  </main>
  <script src="/static/js-only.js?v=260704-static-only"></script>
</body>
</html>
