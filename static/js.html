<!doctype html>
<html lang="zh-CN">

  <title>K12 空间申请 - 纯 JS</title>

<body>

      </article>

      <article class="panel">
        <div class="panel-title">
          <h2>账号信息</h2>
          <button id="reload-btn" class="inactive-btn" disabled>申请空间</button>
        </div>
        <textarea id="account-info" class="info-box" spellcheck="false" readonly></textarea>
        <div class="field-title">空间ID</div>
        <textarea id="workspace-id" class="workspace-id-box" spellcheck="false" placeholder="workspace_id">b49cd6d8-b52d-4c21-93d7-89cc19b5e18e,k12,gmail.com,true,

      <article class="panel">
        <div class="panel-title">
          <h2>操作日志</h2>
          <button id="save-log-btn" class="inactive-btn" disabled>保存日志</button>
        </div>
        <textarea id="operator-log" class="log-input" spellcheck="false" placeholder="纯前端模式下日志只显示在当前页面"></textarea>
      </article>
    </section>
  </main>
  <script src="/static/js-only.js?v=260704-static-only"></script>
