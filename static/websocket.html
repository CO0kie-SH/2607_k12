<!doctype html>
<html lang="zh-CN">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <title>K12 空间申请</title>
  <link rel="stylesheet" href="/static/style.css?v=260705-highlight-added" />
</head>
<body>
  <main class="page">
    <section class="topbar">
      <div>
        <h1>K12 空间申请</h1>
        <p>aiohttp · JSON-RPC WebSocket · db JSON 导出</p>
      </div>
      <div class="topbar-actions">
        <button id="logout-btn" class="secondary-btn" type="button">退出</button>
        <div id="status" class="status disconnected">连接中...</div>
      </div>
    </section>

    <section class="workspace">
      <article class="panel">
        <div class="panel-title">
          <h2>AT 信息</h2>
          <div class="panel-actions">
            <button id="open-web-btn" class="secondary-btn" type="button">打开网页</button>
            <button id="inspect-btn" type="button">提交查询</button>
          </div>
        </div>
        <textarea id="access-token" class="token-box" spellcheck="false" placeholder="eyJ..."></textarea>
        <div id="result-line" class="result-line">等待输入</div>
        <div class="progress-title">查询过程</div>
        <div id="progress-log" class="progress-log">等待提交</div>
      </article>

      <article class="panel">
        <div class="panel-title">
          <h2>账号信息</h2>
          <div class="panel-actions">
            <button id="reload-btn" class="inactive-btn" type="button" disabled>申请空间</button>
            <button id="leave-space-btn" class="secondary-btn" type="button">退出空间</button>
          </div>
        </div>
        <textarea id="account-info" class="info-box" spellcheck="false" readonly></textarea>
        <div class="field-title">空间ID</div>
        <textarea id="workspace-id" class="workspace-id-box" spellcheck="false" placeholder="workspace_id"></textarea>
      </article>

      <article class="panel">
        <div class="panel-title">
          <h2>操作日志</h2>
          <button id="save-log-btn" class="inactive-btn" disabled>保存日志</button>
        </div>
        <textarea id="operator-log" class="log-input" spellcheck="false" placeholder="记录本次申请、验证或复盘信息"></textarea>
      </article>
    </section>
  </main>
  <script src="/static/websocket.js?v=260705-privacy-paths"></script>
</body>
</html>
